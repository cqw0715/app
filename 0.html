<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档生成</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.19.3/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        .editor-toolbar button {
            padding: 5px 10px;
            cursor: pointer;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            margin-right: 4px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .editor-toolbar button:hover { background: #e5e7eb; }
        .editor-toolbar button.active { background: #d1d5db; }
        
        .a4-preview {
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            min-height: 800px;
            position: relative;
            overflow: hidden;
        }
        /* 确保编辑器内的对齐和颜色能被看到 */
        #textEditor span { color: inherit; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div class="max-w-6xl mx-auto p-6">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-blue-700 mb-2">智能文档生成工具 (修复版)</h1>
            <p class="text-gray-500 text-sm">左侧预览文档效果，右侧进行编辑操作</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-7 flex flex-col">
                <div class="bg-white p-4 rounded-lg shadow-md border border-gray-200 flex-1 overflow-y-auto h-[85vh]">
                    <h3 class="text-sm font-bold text-gray-500 mb-3 uppercase tracking-wide">文档实时预览</h3>
                    <div id="previewContent" class="a4-preview p-8 rounded border border-gray-200 text-gray-800 leading-relaxed">
                        <div id="emptyState" class="flex items-center justify-center h-64 text-gray-300">
                            <div class="text-center">
                                <svg class="w-16 h-16 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                <p>暂无内容，请在右侧添加...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-5 space-y-6 h-[85vh] overflow-y-auto pr-2">
                
                <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-blue-500">
                    <h2 class="text-lg font-bold mb-3 flex items-center text-gray-700">
                        <svg class="w-5 h-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        文字段落编辑
                    </h2>
                    <div class="editor-toolbar mb-2 flex flex-wrap items-center gap-2">
                        <select id="fontSizeSelect" class="text-xs border rounded px-2 py-1 bg-white">
                            <option value="1">1号 (极大)</option>
                            <option value="2">2号</option>
                            <option value="3">3号</option>
                            <option value="4">4号 (大)</option>
                            <option value="5" selected>5号 (默认)</option>
                            <option value="6">6号</option>
                            <option value="7">7号 (小)</option>
                        </select>
                        <div class="h-4 w-px bg-gray-300 mx-1"></div>
                        <button onclick="formatDoc('bold')" title="加粗"><b>B</b></button>
                        <button onclick="formatDoc('italic')" title="斜体"><i>I</i></button>
                        <button onclick="formatDoc('underline')" title="下划线"><u>U</u></button>
                        <div class="h-4 w-px bg-gray-300 mx-1"></div>
                        <button onclick="formatDoc('justifyLeft')" title="左对齐">⬅</button>
                        <button onclick="formatDoc('justifyCenter')" title="居中">⬌</button>
                        <button onclick="formatDoc('justifyRight')" title="右对齐">➡</button>
                        <div class="h-4 w-px bg-gray-300 mx-1"></div>
                        <input type="color" id="textColorPicker" oninput="formatDoc('foreColor', this.value)" title="文字颜色" class="w-8 h-8 p-0 border-0 rounded cursor-pointer">
                    </div>
                    <div id="textEditor" contenteditable="true" class="w-full h-40 border border-gray-300 rounded p-3 overflow-y-auto focus:ring-2 focus:ring-blue-200 focus:outline-none text-base bg-white mb-3">
                        在此处输入段落内容...
                    </div>
                    <button onclick="addTextToQueue()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition shadow text-sm">
                        添加此段文字到文档
                    </button>
                </div>

                <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-green-500">
                    <h2 class="text-lg font-bold mb-3 flex items-center text-gray-700">
                        <svg class="w-5 h-5 mr-2 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        插图管理
                    </h2>
                    <div class="space-y-3">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">宽度比例 (%)</label>
                                <input type="number" id="imgWidth" value="80" min="10" max="100" class="w-full border rounded px-2 py-1 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">图片标题</label>
                                <input type="text" id="imgCaption" placeholder="例如：现场照片" class="w-full border rounded px-2 py-1 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">选择图片 (支持多选)</label>
                            <input type="file" id="imageInput" accept="image/*" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"/>
                        </div>
                        <button onclick="addImageToQueue()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition shadow">
                            添加到文档
                        </button>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-purple-500">
                    <h2 class="text-lg font-bold mb-3 flex items-center text-gray-700">
                        <svg class="w-5 h-5 mr-2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        表格管理
                    </h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">表格标题</label>
                            <input type="text" id="tableCaption" placeholder="例如：数据统计表" class="w-full border rounded px-2 py-1 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">上传表格 (Excel/CSV)</label>
                            <input type="file" id="tableInput" accept=".xlsx, .xls, .csv" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100"/>
                        </div>
                        <button onclick="addTableToQueue()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition shadow">
                            解析并添加到文档
                        </button>
                    </div>
                </div>

                <button id="generateBtn" onclick="generatePDF()" class="w-full bg-blue-600 hover:bg-blue-800 text-white text-lg font-bold py-3 rounded shadow-lg transform transition hover:scale-105 flex items-center justify-center sticky bottom-0 z-20">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    生成 PDF 文档
                </button>
            </div>
        </div>
    </div>

    <script>
        let contentQueue = [];

        // 1. 文本编辑器
        function formatDoc(cmd, value = null) {
            document.execCommand(cmd, false, value);
            document.getElementById('textEditor').focus();
        }

        document.getElementById('fontSizeSelect').addEventListener('change', function(e) {
            let size = e.target.value;
            let htmlSize = 3; 
            if(size <= 2) htmlSize = 7;
            else if(size <= 4) htmlSize = 5;
            else if(size <= 7) htmlSize = 3;
            else htmlSize = 1;
            formatDoc('fontSize', htmlSize);
        });

        function addTextToQueue() {
            const editor = document.getElementById('textEditor');
            if (editor.innerText.trim() === "" || editor.innerText === "在此处输入段落内容...") {
                alert("请输入文字内容");
                return;
            }

            // 关键点：保存完整的 HTML 结构以保留样式和对齐
            const content = editor.innerHTML;
            
            contentQueue.push({
                type: 'text',
                id: Date.now() + Math.random(),
                content: content
            });

            editor.innerHTML = ""; 
            renderPreview();
        }

        // 2. 图片处理
        function addImageToQueue() {
            const input = document.getElementById('imageInput');
            const width = document.getElementById('imgWidth').value;
            const caption = document.getElementById('imgCaption').value || '图片';

            if (input.files && input.files.length > 0) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        contentQueue.push({
                            type: 'image',
                            id: Date.now() + Math.random(),
                            src: e.target.result,
                            width: width,
                            caption: caption
                        });
                        renderPreview();
                    };
                    reader.readAsDataURL(file);
                });
                input.value = '';
            } else {
                alert("请先选择图片文件");
            }
        }

        // 3. 表格处理
        function addTableToQueue() {
            const input = document.getElementById('tableInput');
            const caption = document.getElementById('tableCaption').value || '数据表格';

            if (input.files && input.files.length > 0) {
                Array.from(input.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        if (jsonData.length > 0) {
                            const headers = jsonData[0];
                            headers.unshift("序号");
                            for(let i=1; i<jsonData.length; i++) {
                                jsonData[i].unshift(i);
                            }
                            contentQueue.push({
                                type: 'table',
                                id: Date.now() + Math.random(),
                                data: jsonData,
                                caption: caption
                            });
                            renderPreview();
                        }
                    };
                    reader.readAsArrayBuffer(file);
                });
                input.value = '';
            } else {
                alert("请先选择表格文件");
            }
        }

        function removeContent(id) {
            contentQueue = contentQueue.filter(item => item.id !== id);
            renderPreview();
        }

        function renderPreview() {
            const container = document.getElementById('previewContent');
            const emptyState = document.getElementById('emptyState');
            
            container.innerHTML = '';
            if (contentQueue.length === 0) {
                container.appendChild(emptyState);
                emptyState.style.display = 'flex';
                return;
            } else {
                if(emptyState) emptyState.style.display = 'none';
            }

            contentQueue.forEach((item) => {
                const wrapper = document.createElement('div');
                wrapper.className = "relative group mb-6 pb-4 border-b border-gray-100 last:border-0";
                
                const delBtn = document.createElement('button');
                delBtn.innerHTML = '&times;';
                delBtn.className = "absolute top-0 right-0 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center opacity-0 group-hover:opacity-100 transition shadow-lg z-10 transform translate-x-1/2 -translate-y-1/2";
                delBtn.onclick = (e) => { e.stopPropagation(); removeContent(item.id); };
                wrapper.appendChild(delBtn);

                if (item.type === 'text') {
                    const textDiv = document.createElement('div');
                    textDiv.innerHTML = item.content;
                    wrapper.appendChild(textDiv);
                } 
                else if (item.type === 'image') {
                    const imgEl = document.createElement('img');
                    imgEl.src = item.src;
                    imgEl.style.width = `${item.width}%`;
                    imgEl.className = "mx-auto rounded shadow-sm border border-gray-300 block";
                    wrapper.appendChild(imgEl);
                    if (item.caption) {
                        const captionEl = document.createElement('p');
                        captionEl.className = "text-sm font-bold mt-2 text-center text-gray-800";
                        captionEl.innerText = item.caption;
                        wrapper.appendChild(captionEl);
                    }
                } 
                else if (item.type === 'table') {
                    if (item.caption) {
                        const captionEl = document.createElement('p');
                        captionEl.className = "text-sm font-bold mb-2 text-center text-gray-800";
                        captionEl.innerText = item.caption;
                        wrapper.appendChild(captionEl);
                    }
                    const tableWrapper = document.createElement('div');
                    tableWrapper.className = "overflow-x-auto border border-gray-300 rounded";
                    const tableEl = document.createElement('table');
                    tableEl.className = "min-w-full text-sm text-left border-collapse";
                    const thead = document.createElement('thead');
                    thead.className = "bg-gray-100";
                    const trHead = document.createElement('tr');
                    item.data[0].forEach((header, i) => {
                        const th = document.createElement('th');
                        th.className = "border-b border-r border-gray-300 px-3 py-2 font-bold text-gray-700";
                        th.innerText = header;
                        trHead.appendChild(th);
                    });
                    thead.appendChild(trHead);
                    tableEl.appendChild(thead);
                    const tbody = document.createElement('tbody');
                    for(let i=1; i<item.data.length; i++) {
                        const tr = document.createElement('tr');
                        item.data[i].forEach((cell, j) => {
                            const td = document.createElement('td');
                            td.className = "border-b border-r border-gray-300 px-3 py-2 text-gray-600";
                            td.innerText = cell !== undefined ? cell : '';
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    }
                    tableEl.appendChild(tbody);
                    tableWrapper.appendChild(tableEl);
                    wrapper.appendChild(tableWrapper);
                }
                container.appendChild(wrapper);
            });
        }

        // --- 核心修复：PDF 生成 logic ---
        async function generatePDF() {
            const btn = document.getElementById('generateBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "正在加载字体并生成...";
            btn.disabled = true;

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            try {
                // 解决中文乱码：在线加载思源黑体
                const fontUrl = 'https://cdn.jsdelivr.net/npm/pdfmake-fonts-google@1.0.0/lib/fonts/NotoSansSC-Regular.ttf';
                const fontResp = await fetch(fontUrl);
                const fontUint8 = new Uint8Array(await fontResp.arrayBuffer());
                
                // 注册字体
                pdf.addFileToVFS('NotoSans.ttf', btoa(String.fromCharCode.apply(null, fontUint8)));
                pdf.addFont('NotoSans.ttf', 'NotoSans', 'normal');
                pdf.setFont('NotoSans');
            } catch (e) {
                console.error("字体加载失败:", e);
                alert("字体加载失败，中文可能显示不正常。");
            }

            const pageWidth = pdf.internal.pageSize.getWidth();
            const pageHeight = pdf.internal.pageSize.getHeight();
            const margin = 20;
            const contentWidth = pageWidth - 2 * margin;
            let currentY = margin;

            const checkPageBreak = (height) => {
                if (currentY + height > pageHeight - margin) {
                    pdf.addPage();
                    currentY = margin;
                }
            };

            for (let item of contentQueue) {
                if (item.type === 'text') {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = item.content;
                    
                    // 获取文字颜色 (如果有)
                    const fontTag = tempDiv.querySelector('font');
                    const spanTag = tempDiv.querySelector('span');
                    let color = "#000000";
                    if(fontTag && fontTag.color) color = fontTag.color;
                    else if(spanTag && spanTag.style.color) color = spanTag.style.color;

                    // 检测对齐
                    let align = 'left';
                    if (item.content.includes('text-align: center') || item.content.includes('center')) align = 'center';
                    if (item.content.includes('text-align: right') || item.content.includes('right')) align = 'right';

                    const text = tempDiv.innerText || tempDiv.textContent;
                    pdf.setFontSize(11);
                    
                    // 处理十六进制颜色转RGB
                    if(color.startsWith('#')) {
                        const r = parseInt(color.slice(1,3), 16);
                        const g = parseInt(color.slice(3,5), 16);
                        const b = parseInt(color.slice(5,7), 16);
                        pdf.setTextColor(r, g, b);
                    } else if(color.startsWith('rgb')) {
                        const rgb = color.match(/\d+/g);
                        if(rgb) pdf.setTextColor(rgb[0], rgb[1], rgb[2]);
                    }

                    const splitText = pdf.splitTextToSize(text, contentWidth);
                    checkPageBreak(splitText.length * 7);
                    
                    // 核心修复：PDF对齐逻辑
                    splitText.forEach((line) => {
                        let x = margin;
                        if (align === 'center') {
                            const lineWidth = pdf.getTextWidth(line);
                            x = (pageWidth - lineWidth) / 2;
                        } else if (align === 'right') {
                            const lineWidth = pdf.getTextWidth(line);
                            x = pageWidth - margin - lineWidth;
                        }
                        pdf.text(line, x, currentY);
                        currentY += 7;
                    });
                    
                    pdf.setTextColor(0, 0, 0); // 重置颜色
                    currentY += 5;
                } 
                else if (item.type === 'image') {
                    const imgWidthPercent = parseFloat(item.width) / 100;
                    const finalImgWidth = contentWidth * imgWidthPercent;
                    let finalImgHeight = 50;
                    try {
                        const imgProps = pdf.getImageProperties(item.src);
                        finalImgHeight = (imgProps.height * finalImgWidth) / imgProps.width;
                    } catch(e) {}
                    
                    checkPageBreak(finalImgHeight + 15);
                    const imgX = margin + (contentWidth - finalImgWidth) / 2;
                    pdf.addImage(item.src, 'JPEG', imgX, currentY, finalImgWidth, finalImgHeight);
                    
                    if (item.caption) {
                        currentY += finalImgHeight + 7;
                        pdf.setFontSize(10);
                        const captionWidth = pdf.getTextWidth(item.caption);
                        pdf.text(item.caption, (pageWidth - captionWidth) / 2, currentY);
                    }
                    currentY += 15;
                } 
                else if (item.type === 'table') {
                    checkPageBreak(30);
                    if (item.caption) {
                        pdf.setFontSize(11);
                        const captionWidth = pdf.getTextWidth(item.caption);
                        pdf.text(item.caption, (pageWidth - captionWidth) / 2, currentY);
                        currentY += 5;
                    }
                    
                    const tableData = item.data.map(row => row.map(cell => String(cell)));
                    pdf.autoTable({
                        startY: currentY,
                        head: [tableData[0]],
                        body: tableData.slice(1),
                        theme: 'grid',
                        styles: { font: 'NotoSans', fontSize: 9, halign: 'center' },
                        headStyles: { fillColor: [240, 240, 240], textColor: 0 },
                        margin: { left: margin, right: margin }
                    });
                    currentY = pdf.lastAutoTable.finalY + 15;
                }
            }
            pdf.save('生成的文档.pdf');
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    </script>
</body>
</html>
